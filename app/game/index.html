<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#173956"><style>html:not(.j3-open) body{display:none!important}</style><script src="../../core/gate.js"></script><title>콩콩 점프 · 냥콩의 기차 여행</title><link rel="icon" href="../icons/favicon.ico"><link rel="stylesheet" href="game.css"></head><body>
<header><a href="../../index.html" target="_top" aria-label="계량지표 총괄로 돌아가기">‹ 총괄</a><b>콩콩 점프 <small>냥콩의 기차 여행</small></b><button id="pause" aria-label="일시정지" disabled>Ⅱ</button></header>
<div class="level-strip"><div><span>LEVEL</span> <b id="level">01</b><small>/ 10</small></div><span id="best-level">최고 Lv.0</span><div id="time" class="timer">30초</div></div>
<div class="hud"><div><small>누적 운행㎞</small><b id="distance">0 <em>㎞</em></b></div><div><small>나의 최고</small><b id="best">0 <em>㎞</em></b></div><div class="run-status"><span id="hearts" aria-label="기회 3번">♥ ♥ ♥</span><small>기회 3번</small></div></div>
<main id="arena" aria-label="콩콩 점프 게임 화면"><canvas id="scene" tabindex="0" role="img" aria-label="화면을 누르거나 스페이스 키로 장애물을 뛰어넘으세요">Canvas를 지원하는 브라우저가 필요합니다.</canvas><div class="journey"><i id="progress"></i></div><div id="tap-hint">화면 어디든 톡! 점프</div>
<section id="overlay" aria-labelledby="panel-title"><div class="panel"><div class="eyebrow" id="eyebrow">10개의 레벨, 한 칸씩 앞으로</div><h1 id="panel-title">콩콩 <span>점프</span></h1><div id="level-path" class="level-path" aria-label="10개 레벨 진행"></div><img id="panel-art" src="../content/mascot/kpi_mascot_high.png" alt="기대에 찬 냥콩" width="130" height="130"><p id="panel-copy">레벨마다 30초, 점점 빨라져요.<br>냥콩과 열 번째 역까지 달려요!</p><div id="result" hidden></div><button id="action" class="primary">여행 시작 <span>→</span></button><small id="panel-note">레벨 1–10 · 각 30초 · 레벨마다 기회 3번</small></div></section>
</main><footer>게임 속 가상 거리예요 · KPI 실적과 점수에는 영향 없음</footer><div id="announce" class="sr-only" role="status" aria-live="polite"></div><script src="engine.js"></script><script src="game.js"></script></body></html>
