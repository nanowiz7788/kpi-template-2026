<script>

const DUR=1600;
const SIDES=[ // body faces: art, rot180?, outward normal in body coords
 {id:'fRight',k:'right',r:false,n:[1,0,0]},{id:'fLeft',k:'left',r:false,n:[0,1,0]},
 {id:'fBRight',k:'right',r:true,n:[-1,0,0]},{id:'fBLeft',k:'left',r:true,n:[0,-1,0]}];
const LIGHT=(()=>{const l=[.5,-.25,.8],m=Math.hypot(...l);return l.map(v=>v/m)})();
const gshade=n=>.55+.45*(n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2]);
const BASE={right:'#4f6b96',left:'#26375a'};
const FINAL={right:'url(#gr)',left:'url(#gl)'};
const NFINAL={right:[1,0,0],left:[0,1,0]};
function hex(c){return[1,3,5].map(i=>parseInt(c.substr(i,2),16))}
function shade(c,f){return'rgb('+hex(c).map(v=>Math.round(clamp(v*f,0,255))).join(',')+')'}
function SETUP_(){}
function render(t){
 const fin=t>=DUR,w=$('world');
 // spin: half turn, mild overshoot, settles on the front iso angle
 const us=seg(t,0,1150),psi=-Math.PI*(1-eOutBack(1-Math.pow(1-us,1.9),1.1));
 // drop with a tiny bounce, tilt (roll) settling
 const H=Math.min(VB.h*.5,520)+120;
 let drop;
 const ud=seg(t,0,720);
 if(t<720)drop=-H*(1-ud*ud);else{const ub=seg(t,720,1000);drop=-24*Math.sin(Math.PI*ub)*(1-ub)}
 const roll=(1-eOutBack(seg(t,0,1250),1.6))*12;
 const sc=.9+.1*eOutCubic(seg(t,0,720));
 const squ=Math.sin(Math.PI*seg(t,700,860))*.025;
 const cz=Math.cos(psi),sz=Math.sin(psi);
 const T3=p=>{const x=p[0]-.5,y=p[1]-.5;return[.5+x*cz-y*sz,.5+x*sz+y*cz,p[2]]};
 const R=n=>[n[0]*cz-n[1]*sz,n[0]*sz+n[1]*cz,n[2]];
 if(fin)w.removeAttribute('transform');
 else w.setAttribute('transform',`translate(0 ${drop}) translate(${C[0]} ${C[1]}) rotate(${roll}) scale(${sc*(1+squ*.5)} ${sc*(1-squ)}) translate(${-C[0]} ${-C[1]})`);
 const top=$('fTop');
 if(fin)top.removeAttribute('transform');else top.setAttribute('transform',affine(FACE.top,T3));
 for(const s of SIDES){
  const el=$(s.id),n=R(s.n);
  const vis=fin?(!s.r):(n[0]+n[1]+n[2]>.0005);
  el.style.display=vis?'':'none';
  if(!vis)continue;
  if(fin){el.removeAttribute('transform');el.firstChild.setAttribute('fill',FINAL[s.k]);continue}
  el.setAttribute('transform',affine(FACE[s.k],T3,s.r));
  el.firstChild.setAttribute('fill',shade(BASE[s.k],gshade(n)/gshade(NFINAL[s.k])));
 }
 // soft shadow: lands with the cube, then fades so the last frame is exactly the logo
 const sh=$('shadow');
 const air=clamp(-drop/H);
 let op=.0;
 if(!fin){op=(.30*(1-air*air))*(1-seg(t,1150,1600));
   const widen=1-.35*air;sh.setAttribute('rx',215*widen);sh.setAttribute('ry',42*widen)}
 sh.setAttribute('opacity',op<0?0:op);
}

const C=[627,618],S=337,K=Math.sqrt(3)/2;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eOutCubic=u=>1-Math.pow(1-u,3);
const eInOutCubic=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const eOutBack=(u,s=1.70158)=>1+(s+1)*Math.pow(u-1,3)+s*Math.pow(u-1,2);
const smooth=u=>u*u*(3-2*u);
const proj=p=>[C[0]+S*K*(p[0]-p[1]),C[1]+S*((p[0]+p[1])/2-p[2])];
function inv(pl,q){const X=(q[0]-C[0])/S,Y=(q[1]-C[1])/S,v=pl[1];
 if(pl[0]==='z'){const d=X/K,s=2*(Y+v);return[(s+d)/2,(s-d)/2,v]}
 if(pl[0]==='x'){const y=v-X/K;return[v,y,(v+y)/2-Y]}
 const x=v+X/K;return[x,v,(x+v)/2-Y]}
/* each art face: ideal plane + the small outward "explode" offset (screen px) the logo has between faces */
const FACE={
 top:{pl:['z',1],d:[0,-22]},
 right:{pl:['x',1],d:[20,0]},
 left:{pl:['y',1],d:[-20,0]}};
function solveOff(d,pl){ // 3D offset whose projection equals screen offset d, expressed in the face plane
 const ex=[1,0,0],ey=[0,1,0],ez=[0,0,1];
 const a=Math.abs; // offsets along plane axes
 if(pl[0]==='z') return [0,0,-d[1]/S];
 if(pl[0]==='x'){const e=d[0]/(2*K*S);return[e,-e,0]}
 const e=d[0]/(2*K*S);return[e,-e,0]}
for(const k in FACE){const f=FACE[k];f.o=solveOff(f.d,f.pl);
 // check: proj(offset)-proj(0)
}
/* point on the ideal (unexploded + explode-offset) cube for logo pixel q */
function P3(f,q){const p=inv(f.pl,[q[0]-f.d[0],q[1]-f.d[1]]);return[p[0]+f.o[0],p[1]+f.o[1],p[2]+f.o[2]]}
function affine(f,T3,rot180){
 const pts=[[0,0],[1,0],[0,1]].map(q=>{let p=P3(f,q);if(rot180)p=[1-p[0],1-p[1],p[2]];return proj(T3(p))});
 const [p0,p1,p2]=pts;
 return `matrix(${p1[0]-p0[0]} ${p1[1]-p0[1]} ${p2[0]-p0[0]} ${p2[1]-p0[1]} ${p0[0]} ${p0[1]})`}
function bbCenter(id){const b=$(id).getBBox();return[b.x+b.width/2,b.y+b.height/2]}
/* viewport: logo drawn at min(96vw,480px) wide, centred, like the original */
function fit(){const vw=innerWidth,vh=innerHeight,k=Math.min(.96*vw,480)/1254;
 const svg=$('svg');svg.setAttribute('viewBox',`${627-vw/(2*k)} ${627-vh/(2*k)} ${vw/k} ${vh/k}`);
 window.VB={w:vw/k,h:vh/k}}
addEventListener('resize',()=>{fit();render(window.__t==null?DUR:window.__t)});
let raf=0,t0=0;
function loop(now){const t=now-t0;if(t>=DUR){window.__t=DUR;render(DUR);raf=0;shineOn();return}window.__t=t;render(t);raf=requestAnimationFrame(loop)}
function play(){shineOff();cancelAnimationFrame(raf);t0=performance.now();raf=requestAnimationFrame(loop)}
window.__seek=t=>{cancelAnimationFrame(raf);raf=0;window.__t=t;render(Math.min(t,DUR))};
function buildClip(){const cp=$('cubeclip');['pTop'].map(id=>$(id)).concat([$('fRight').firstChild,$('fLeft').firstChild]).forEach(p=>{const c=document.createElementNS('http://www.w3.org/2000/svg','path');c.setAttribute('d',p.getAttribute('d'));cp.appendChild(c)})}
function shineOff(){const st=$('stage');st.classList.remove('shine');$('shine').style.display='none'}
function shineOn(){const st=$('stage');$('shine').style.display='';st.classList.remove('shine');void st.offsetWidth;st.classList.add('shine')}
function init(){fit();setup&&setup();buildClip();
 if(window.__noauto){render(0);return}
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){render(DUR);return}
 render(0);play()}
$('stage').addEventListener('pointerdown',e=>{e.preventDefault();play()});
document.addEventListener('keydown',play);
window.__ready=false;
const setup=SETUP_;

document.fonts&&document.fonts.ready;init();window.__ready=true;
</script></body></html>
